  - Checklist hebdomadaire : weekly-checklist.md
  - Références: content.md
  - À propos: about.md

theme:
  name: material
  language: fr
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    # Dark Mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Dark mode
      primary: indigo
      accent: green

    # Light Mode
    - scheme: smooth-default
      toggle:
        icon: material/weather-night
        name: Light mode
      primary: indigo
      accent: light green 
  features:
    - navigation.top
    - search.suggest
    - search.highlight
    - navigation.indexes
    - toc.follow

plugins:
  - search
  - document-dates:
      position: bottom         # Display position: top (after title)  bottom (end of document)
      type: date               # Date type: date  datetime  timeago, default: date
      exclude:                 
        - index.md
        - about.md
        - drafts/*             # Exclude all files in drafts folder, including subfolders
      date_format: '%Y-%m-%d'  # Date format strings, e.g., %Y-%m-%d, %b %d, %Y, etc
      time_format: '%H:%M:%S'  # Time format strings (valid only if type=datetime)
      show_author: false        # Show author or not, default: true

extra:
  analytics:
    provider: google
    property: G-S6S1LDV0T3

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.blocks.caption
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      

extra_css:
  - stylesheets/grid-links.css
  - stylesheets/themes.css
  - stylesheets/frontpage.css
  - https://rsms.me/inter/inter.css 

